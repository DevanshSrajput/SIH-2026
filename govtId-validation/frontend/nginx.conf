server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Document scans from a checkpoint camera routinely exceed nginx's 1MB default,
    # and the failure mode is a 413 the console cannot explain.
    client_max_body_size 40m;

    # Single-page app: unknown paths are routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Face comparison and the forensic detectors are slow on a large scan.
        proxy_read_timeout 120s;
    }

    # The live capture-quality hint calls the face service on every frame while the
    # officer lines the traveller up, so it goes direct rather than through the
    # screening API, which would also run OCR and forensics.
    location /face-service/ {
        proxy_pass http://face-service:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 20m;
    }

    location /actuator/ {
        proxy_pass http://backend:8080;
    }

    # Hashed asset filenames, so these are safe to cache indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
