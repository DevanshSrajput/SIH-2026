spring:
  application:
    name: govtid-screening
  mongodb:
    # Connection settings live under `spring.mongodb` since Spring Boot 4.0. The old
    # `spring.data.mongodb` connection keys are removed, and an unknown key is ignored
    # silently rather than failing, so leaving them here loses the database name and
    # writes everything to the driver default `test`.
    uri: ${MONGODB_URI:mongodb://localhost:27017/govtid_screening}
  data:
    mongodb:
      # Mapping-side setting; this one is still a `spring.data.mongodb` key.
      auto-index-creation: true
  servlet:
    multipart:
      # Document scans from a checkpoint camera routinely exceed the 1MB default.
      max-file-size: 20MB
      max-request-size: 40MB
  jackson:
    # Null fields are omitted so the console can distinguish "not present on the document"
    # from "read as empty". Jackson 3 already writes dates as ISO-8601 by default.
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    # Machine-readable document. The Swagger UI page reads this same path.
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    display-request-duration: true
    # Collapsed on open: an officer console API is browsed by area, not read top to bottom.
    doc-expansion: none
  # Actuator is an operations surface, not part of the officer API contract.
  show-actuator: false
  default-produces-media-type: application/json

screening:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}

  risk:
    # Score at or above which the recommendation becomes REJECT.
    reject-threshold: 70
    # Score at or above which the case is referred to an officer.
    review-threshold: 35

  ocr:
    claude:
      # Vision OCR. Inactive unless an Anthropic credential is present in the environment.
      enabled: true
      effort: medium
    tesseract:
      # Tried first; if it does not answer, the standard install locations for this
      # platform are probed automatically, so no PATH editing is needed.
      binary: ${TESSERACT_BINARY:tesseract}
      languages: eng
      timeout-seconds: 30

  face:
    # Point at the face verification service to activate Module 4. No similarity score is
    # ever estimated without a matcher.
    #
    # Empty by default on purpose. An unset URL makes Module 4 report SKIPPED - it did not
    # run - whereas a default pointing at a service that happens to be down would make it
    # report FAILED, and RiskEngine refuses to return CLEAR on a failed module. Every
    # screening on a machine without the face service would then be referred for review.
    # start.ps1 and docker-compose set FACE_SERVICE_URL when they bring the service up.
    service-url: ${FACE_SERVICE_URL:}
    timeout-seconds: 15

    # ------------------------------------------------------------------
    # Thresholds are RAW COSINE similarities between SFace embeddings, not rescaled
    # percentages. SFace's own published break-even point is 0.363; the match threshold
    # sits deliberately above it.
    #
    # A false accept at a checkpoint waves an impostor through on someone else's
    # passport. A false referral costs an officer a few seconds. The two errors are not
    # symmetric and these numbers are not set as though they were.
    #
    # Verify them against your own cameras and scanners before going live:
    #   python face-verification-service/calibrate.py <samples-dir>
    # ------------------------------------------------------------------
    match-threshold: ${FACE_MATCH_THRESHOLD:0.46}
    mismatch-threshold: ${FACE_MISMATCH_THRESHOLD:0.28}
    # A score this close to either threshold is reported inconclusive even when it falls
    # on the decisive side: the thresholds are estimates from a finite sample, not
    # physical constants.
    uncertain-margin: 0.03

    # 1:N identification is stricter than 1:1 verification. Every extra enrolled subject
    # is another chance for a coincidental high score, and the top candidate must also
    # beat the best-scoring different person by `identify-margin` to be named.
    identify-threshold: ${FACE_IDENTIFY_THRESHOLD:0.52}
    identify-margin: 0.06

  watchlist:
    # Presentations of one document within 24 hours before velocity is flagged.
    velocity-threshold: 3

  rate-limit:
    # Caps expensive write requests per client. Reads are never limited - throttling an
    # officer's console mid-shift is worse than the flood it would prevent.
    #
    # The counter is in-memory and therefore per-instance: behind a load balancer the
    # effective limit multiplies by the instance count. Turn this off and use a shared
    # counter if you run more than one node.
    enabled: ${RATE_LIMIT_ENABLED:true}
    requests-per-minute: ${RATE_LIMIT_RPM:60}
    window-seconds: 60

logging:
  level:
    com.govid.screening: INFO
